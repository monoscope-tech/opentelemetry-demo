# Builds the handful of demo services this fork actually modifies and pushes
# them to the fork's own registry.
#
# Upstream's `build-images.yml` is guarded by `if: !github.event.repository.fork`
# and so never runs here — and it builds all ~20 services, which we do not
# need. This one takes an explicit list, defaults to the services we change,
# and is dispatched by hand.
#
# amd64 only: the demo cluster is amd64, and cross-building the Next.js
# frontend under QEMU takes tens of minutes for an image nothing runs.

name: Monoscope build images

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Comma-separated service names (must match src/<name>/Dockerfile)'
        default: 'frontend,load-generator'
        required: true
        type: string
      tag:
        description: 'Image tag prefix. Defaults to the short commit sha.'
        default: ''
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      tag: ${{ steps.set.outputs.tag }}
    steps:
      - id: set
        env:
          SERVICES: ${{ inputs.services }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          echo "matrix=$(echo "$SERVICES" | tr ',' '\n' | sed 's/ //g' | grep -v '^$' | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_INPUT:-${GITHUB_SHA::7}}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # cart is the one service whose Dockerfile is not at src/<name>/Dockerfile.
      - id: dockerfile
        run: |
          if [ "${{ matrix.service }}" = "cart" ]; then
            echo "path=./src/cart/src/Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "path=./src/${{ matrix.service }}/Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: ./
          file: ${{ steps.dockerfile.outputs.path }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/monoscope-tech/demo:${{ needs.prepare.outputs.tag }}-${{ matrix.service }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
