# Overlay applied on top of the otel-demo chart values to fan the bundled
# otel-collector's traces / metrics / logs out to the in-cluster
# monoscope-agent collector — which is the component that holds the API
# key secret and forwards to monoscope.tech. The bundled collector itself
# stays vanilla: no secrets, no x-api-key, no auth concerns.
#
# Apply:
#   helm upgrade otel-demo open-telemetry/opentelemetry-demo \
#     --version 0.41.0 --reset-values --values monoscope-k8s/otel-demo-overlay.yaml
#
# (--reset-values clears any previous user-supplied values so the bundled
# collector returns to chart defaults plus only what's added here.)
#
# PIN THE CHART VERSION. This file re-lists chart-default exporter names
# verbatim (see the pipelines block below), and 0.41.0 renamed every one of
# them — otlp/jaeger -> otlp_grpc/jaeger, spanmetrics -> span_metrics,
# otlphttp/prometheus -> otlp_http/prometheus. Applying an overlay written for
# one chart version against another produces a collector config referencing
# exporters that do not exist, the collector refuses to start, and ALL demo
# telemetry stops. Re-sync this file against
# `helm show values open-telemetry/opentelemetry-demo --version <v>`
# whenever the pinned version changes.
#
# Currently written for: chart 0.41.0 (app version 3.0.0).

# Prometheus: the chart caps server memory at 400Mi, but with 7d retention +
# exemplar-storage (exemplars stream in from the spanmetrics connector) the TSDB
# head OOMKills within ~1min of becoming ready. The pod had crash-looped 4682×,
# and EVERY restart replays the WAL — logging one WARN per exemplar record
# ("Unexpected error when replaying WAL on exemplar record", err="out of order
# exemplar"), ~34k lines each time. filelog scrapes that stdout (tagged
# service.name=otel-demo) and floods monoscope. Raising the limit stops the OOM,
# which stops the restarts, which stops the WAL-replay spam. The exemplar WARNs
# themselves are benign (Prometheus skips out-of-order exemplars on replay).
prometheus:
  server:
    resources:
      requests:
        memory: 512Mi
      limits:
        memory: 1536Mi

# The 3.0.0 line adds three LLM-backed services. `agent` requires an
# OPENAI_API_KEY, `chatbot` is a Gradio front end for it, and `mcp` serves it
# tools — none of which we hold credentials for, so all three would crash-loop
# and emit nothing but startup failures. That is not "realistic demo errors",
# it is three broken pods burning memory on nodes already sitting at 56-64%.
# Re-enable them (and add the key) if the demo ever wants the GenAI story.
components:
  agent:
    enabled: false
  chatbot:
    enabled: false
  mcp:
    enabled: false

opentelemetry-collector:
  # Run the bundled collector as a singleton Deployment instead of the chart's
  # default DaemonSet. The chart-default daemonset binds host ports (jaeger
  # receivers on 6831/14250/14268) that would collide with the monoscope-agent
  # daemonset. A singleton has no host-level needs for this demo.
  mode: deployment

  # The chart default (200Mi) is far too low for this collector: besides OTLP it
  # runs hostmetrics, k8s_cluster, kubeletstats, kafkametrics and the spanmetrics
  # connector. At ~150Mi/200Mi the memory_limiter (limit 80% / spike 25%) sits
  # permanently above its soft threshold and refuses incoming data — silently
  # dropping traces & metrics before the otlp/monoscope-agent exporter sees them
  # (logs are unaffected: they reach monoscope via the agent's filelog, not here).
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 1Gi

  config:
    exporters:
      # In-cluster forward to the monoscope-agent DaemonSet. The agent has
      # internalTrafficPolicy: Local, so OTLP requests stay on-node when
      # possible. The agent attaches x-api-key and exports to monoscope.tech.
      otlp/monoscope-agent:
        endpoint: monoscope-agent-opentelemetry-collector.default.svc.cluster.local:4317
        tls:
          insecure: true

    service:
      pipelines:
        # Append otlp/monoscope-agent to each pipeline's existing exporters.
        # The chart merges receivers/processors but replaces pipeline arrays,
        # so we re-list the chart-default exporters here verbatim. If the
        # chart updates its defaults, this list must be re-synced (check
        # `helm show values open-telemetry/opentelemetry-demo --version <v>`).
        #
        # Names below are the 0.41.0 spellings — see the version warning at the
        # top of this file before changing the pinned chart version.
        #
        # The `profiles` pipeline that 0.41.0 adds is deliberately NOT listed:
        # naming it here would replace its exporter array too, and it exports to
        # firepit, which the chart disables by default. Leaving it unnamed keeps
        # the chart default intact.
        traces:
          exporters: [otlp_grpc/jaeger, debug, span_metrics, otlp/monoscope-agent]
        metrics:
          exporters: [otlp_http/prometheus, debug, otlp/monoscope-agent]
        # Logs ARE forwarded to monoscope-agent. These are the OTLP log records
        # emitted by the OTel logger SDKs, which carry trace_id/span_id from the
        # active span — so logs land trace-correlated in monoscope (clickable
        # span↔log). The stdout copy that filelog scrapes has NO trace context
        # (it's plain console text), so forwarding OTLP is what enables
        # correlation. Double-counting is prevented at the OTHER end: the agent's
        # filelog excludes the pods of every service that emits OTLP logs (see
        # values-agent.yaml). Uninstrumented services (frontend, flagd,
        # image-provider, databases, …) emit no OTLP logs, so they keep flowing
        # via filelog only — no duplication.
        logs:
          exporters: [opensearch, debug, otlp/monoscope-agent]
