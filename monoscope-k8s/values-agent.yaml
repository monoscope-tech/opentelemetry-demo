mode: daemonset

# Daemonset mode skips a ClusterIP Service by default (each node runs its own
# pod). Enable it so other in-cluster collectors / apps can forward OTLP to a
# stable DNS name. internalTrafficPolicy: Local keeps requests on the same
# node when possible (saves cross-node hops for app-to-agent traffic).
service:
  enabled: true
  internalTrafficPolicy: Local

image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
  tag: "0.149.0"

# Pod-level limits — required so the chart's GOMEMLIMIT helper activates.
# Without limits.memory, GOMEMLIMIT is silently disabled and the Go runtime
# can spike past memory_limiter under burst load. Tune for your workload.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

presets:
  logsCollection:
    enabled: true
  kubeletMetrics:
    enabled: true
  kubernetesAttributes:
    enabled: true          # Provides RBAC + a rich metadata extractor (workload kinds,
                           # container.image.*, k8s.cluster.uid, service.* from annotations).
                           # Pipelines reference it as `k8sattributes` (the chart still uses
                           # the deprecated alias internally — known chart noise, harmless).

extraEnvs:
  - name: MONOSCOPE_API_KEY
    valueFrom:
      secretKeyRef:
        name: monoscope-secrets
        key: api-key

config:
  extensions:
    health_check:
      endpoint: 0.0.0.0:13133

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

    # filelog is created by the logsCollection preset (include: all pods,
    # operators: container-parser). We override only `exclude` to drop the
    # stdout of services that ALSO emit OTLP logs — those reach monoscope via
    # the bundled collector's logs pipeline WITH trace_id/span_id, so scraping
    # their stdout here would double-count and add a trace-less duplicate.
    #
    # The excluded set == every service observed emitting OTLP logs (the OTel
    # logger SDK / javaagent is wired up). Everything NOT listed (frontend,
    # flagd, image-provider, astronomy-db, valkey, grafana, jaeger, prometheus,
    # opensearch, opamp-server, telemetry-docs, …) emits no OTLP logs, so
    # filelog stays its only log source — uninstrumented pod logs are preserved.
    #
    # Re-sync when adding/removing instrumented services. This list is wrong in
    # BOTH directions and both are silent:
    #   - a service that starts shipping OTLP logs and is not excluded here has
    #     its logs counted twice
    #   - a service excluded here that does NOT ship OTLP logs has its logs
    #     dropped entirely, with nothing to notice
    #
    # Verify against the data rather than by reading the deployment list:
    #
    #   monoscope chart 'kind == "log" and context.trace_id != ""
    #                    | summarize count(*) by resource.service.name' --since 15m
    #
    # Every service that query returns belongs here; nothing else does. Last
    # verified against the live demo project 2026-08-27, chart 0.41.0.
    filelog:
      exclude:
        # keep the agent's own self-exclusion (preset default)
        - /var/log/pods/default_monoscope-agent-opentelemetry-collector*_*/opentelemetry-collector/*.log
        # services that emit OTLP logs (trace-correlated via the OTLP path)
        - /var/log/pods/default_accounting-*_*/*/*.log
        - /var/log/pods/default_ad-*_*/*/*.log
        - /var/log/pods/default_cart-*_*/*/*.log
        - /var/log/pods/default_checkout-*_*/*/*.log
        - /var/log/pods/default_currency-*_*/*/*.log
        - /var/log/pods/default_email-*_*/*/*.log
        - /var/log/pods/default_fraud-detection-*_*/*/*.log
        - /var/log/pods/default_frontend-proxy-*_*/*/*.log
        # kafka was excluded here but emits NO OTLP logs — the javaagent is
        # attached for traces and metrics only. Excluding it meant its stdout
        # was never scraped and its logs reached monoscope from nowhere at all:
        # zero kafka log records, silently, for as long as this list has
        # existed. Left off deliberately; re-add only if it starts emitting
        # OTLP logs.
        - /var/log/pods/default_load-generator-*_*/*/*.log
        - /var/log/pods/default_payment-*_*/*/*.log
        - /var/log/pods/default_product-catalog-*_*/*/*.log
        # product-reviews was removed from the demo upstream in 3.0.0.
        - /var/log/pods/default_quote-*_*/*/*.log
        - /var/log/pods/default_recommendation-*_*/*/*.log
        - /var/log/pods/default_shipping-*_*/*/*.log

  processors:
    batch: {}
    memory_limiter:
      check_interval: 1s
      limit_mib: 4000
      spike_limit_mib: 800
    resource:
      attributes:
        - key: x-api-key
          value: ${env:MONOSCOPE_API_KEY}
          action: upsert

  exporters:
    otlp_grpc:
      endpoint: "otelcol.monoscope.tech:4317"
      tls:
        insecure: true

  service:
    extensions: [health_check]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [k8sattributes, memory_limiter, batch, resource]
        exporters: [otlp_grpc]
      metrics:
        receivers: [otlp, kubeletstats]
        processors: [k8sattributes, memory_limiter, batch, resource]
        exporters: [otlp_grpc]
      logs:
        receivers: [otlp, filelog]
        processors: [k8sattributes, memory_limiter, batch, resource]
        exporters: [otlp_grpc]
