title: Demo — recommendation service errors
severity: Error
active: true
condition:
  query: resource.service.name == "recommendation" and status_code == "ERROR" | summarize
    count(*) by bin_auto(timestamp)
  alert_threshold: 5
  warning_threshold: 2
  trigger_less_than: false
evaluation:
  check_interval_mins: 5
  time_window_mins: 15
  threshold_sustained_for_mins: 0
notify:
  subject: Recommendation service is returning errors
  message: The recommendation service returned more errors than expected in the last
    15 minutes. Open the trace from the alert to see which product ids were being
    recommended when it failed.
  email_all: false
  teams:
  - 44d2c9c5-f7e8-448a-966a-ec1b8f20780b
