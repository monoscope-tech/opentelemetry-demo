title: Demo — ad service errors
severity: Warning
active: true
condition:
  query: resource.service.name == "ad" and status_code == "ERROR" | summarize count(*)
    by bin_auto(timestamp)
  alert_threshold: 8
  warning_threshold: 3
  trigger_less_than: false
evaluation:
  check_interval_mins: 5
  time_window_mins: 15
  threshold_sustained_for_mins: 0
notify:
  subject: Ad service error rate elevated
  message: The ad service is failing a share of requests. The demo drives this deliberately
    through the adFailure feature flag, so this monitor doubles as a live check that
    flag-driven failures surface as alerts.
  email_all: false
  teams:
  - 44d2c9c5-f7e8-448a-966a-ec1b8f20780b
