  - layout:
      h: 4
      w: 6
      x: null
      'y': null
    sql: |
      SELECT
        time_bucket('{{rollup_interval}}', timestamp) as timestamp,
        metric_name as series,
        AVG(value) / 1048576 as value
      FROM otel_metrics
      WHERE project_id='{{project_id}}'
        AND metric_name IN ('redis.memory.used', 'redis.memory.rss', 'redis.memory.peak')
        {{time_filter}}
      GROUP BY time_bucket('{{rollup_interval}}', timestamp), metric_name
      ORDER BY timestamp DESC
      LIMIT 3000
    title: Redis Memory Usage
    type: timeseries
    unit: MB
  - columns:
    - align: null
      clickable: null
      column_type: null
      field: metric_name
      link: null
      progress: null
      progress_variant: null
      sortable: null
      title: Metric
      unit: null
      width: null
    - align: null
      clickable: null
      column_type: null
      field: data_points
      link: null
      progress: column_percent
      progress_variant: null
      sortable: true
      title: Data Points
      unit: null
      width: null
    - align: null
      clickable: null
      column_type: null
      field: unit
      link: null
      progress: null
      progress_variant: null
      sortable: true
      title: Unit
      unit: null
      width: null
    default_sort: COUNT(*) DESC
    layout:
      h: 4
      w: 6
      x: null
      'y': null
    sql: |
      SELECT
        metric_name,
        COUNT(*) as data_points,
        COALESCE(MAX(metric_unit), '-') as unit
      FROM otel_metrics
      WHERE project_id='{{project_id}}'
        {{time_filter}}
      GROUP BY metric_name
      ORDER BY {{table_sort}}
      LIMIT 20
    title: Available Metrics
    type: table
