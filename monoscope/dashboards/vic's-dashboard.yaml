constants:
- description: Top 20 resources by request count for the current time range
  key: top_resources
  query: null
  result: null
  sql:
    source: timefusion
    statement: |
      SELECT name
      FROM otel_logs_and_spans
      WHERE project_id='{{project_id}}'
        AND name IS NOT NULL
        AND kind = 'server'
        AND ('{{var-resource}}' = '' OR name = '{{var-resource}}')
        {{time_filter}}
      GROUP BY name
      ORDER BY COUNT(*) DESC
      LIMIT 20
description: Comprehensive system overview with service, resource, and database insights
discovery_metrics: null
file: _overview.yaml
icon: qrcode
preview: /public/assets/svgs/screens/http-stats.svg
refresh_interval: 60s
tabs:
- icon: grid
  name: Overview
  requires: null
  widgets:
  - children:
    - description: Request rate across inbound requests AND SDK-instrumented outbound
        calls. Measures system load and usage patterns.
      icon: activity
      layout:
        h: 2
        w: 3
        x: null
        'y': null
      query: |
        (kind == "server" or name == "apitoolkit-http-span" or name == "monoscope.http")
        | summarize count() by bin_auto(timestamp)
      summarize_by: rate
      title: Traffic
      type: timeseries_stat
      unit: req/min
    - description: 95th percentile response time across inbound requests AND SDK-instrumented
        outbound calls. 95% complete faster than this.
      icon: clock
      layout:
        h: 2
        w: 3
        x: null
        'y': null
      query: |
        (kind == "server" or name == "apitoolkit-http-span" or name == "monoscope.http") and duration != null
        | summarize p95(duration) / 1000000 by bin_auto(timestamp)
      summarize_by: mean
      title: P95 Latency
      type: timeseries_stat
      unit: ms
    - alert_threshold: 5
      description: Percentage of failed requests (5xx errors) across inbound requests
        AND SDK-instrumented outbound calls. A failing third-party dependency raises
        this. Lower is better.
      icon: alert-triangle
      layout:
        h: 2
        w: 3
        x: null
        'y': null
      query: |
        (kind == "server" or name == "apitoolkit-http-span" or name == "monoscope.http")
        | summarize round(countif(status_code == "ERROR" or coalesce(attributes.http.response.status_code, 0) >= 500) * 100.0 / count(), 2) by bin_auto(timestamp)
      summarize_by: mean
      title: Error Rate
      type: timeseries_stat
      unit: '%'
    - description: Application Performance Index (0-1). Measures user satisfaction
        based on response times. >0.9 is excellent, <0.5 is poor.
      icon: smile
      layout:
        h: 2
        w: 3
        x: null
        'y': null
      sql: SELECT ROUND((SUM(CASE WHEN duration <= 500000000 THEN 1.0 WHEN duration
        <= 2000000000 THEN 0.5 ELSE 0 END)) / GREATEST(1, COUNT(*))::numeric, 2)::float
        FROM otel_logs_and_spans WHERE project_id='{{project_id}}' AND (kind = 'server'
        OR name = 'apitoolkit-http-span' OR name = 'monoscope.http') AND duration
        IS NOT NULL {{time_filter}}
      title: Apdex Score
      type: stat
      unit: /1.0
    description: 'The four key metrics from Google SRE for monitoring distributed
      systems: Traffic, Latency, Errors, and Saturation.'
    layout:
      h: 4
      w: 12
      x: null
      'y': null
    title: Golden Signals
    type: group
  - children:
    - icon: server
      layout:
        h: 2
        w: 3
        x: null
        'y': null
      query: |
        resource.service.name != null
        | summarize dcount(resource.service.name)
      title: Active Services
      type: stat
      unit: services
    - icon: list-tree
      layout:
        h: 2
        w: 3
        x: null
        'y': null
      query: |
        (kind == "server" or name == "apitoolkit-http-span" or name == "monoscope.http")
        | summarize count()
      title: Total Requests
      type: stat
      unit: reqs
    - icon: database
      layout:
        h: 2
        w: 3
        x: null
        'y': null
      query: |
        attributes.db.system.name != null
        | summarize dcount(attributes.db.system.name)
      title: DB Systems
      type: stat
      unit: systems
    - icon: route
      layout:
        h: 2
        w: 3
        x: null
        'y': null
      query: |
        (kind == "server" or name == "apitoolkit-http-span") and name != null
        | summarize dcount(name)
      title: Unique Endpoints
      type: stat
      unit: endpoints
    layout:
      h: 2
      w: 12
      x: null
      'y': null
    title: System Overview
    type: group
  - columns:
    - align: null
      clickable: null
      column_type: null
      field: service_name
      link: null
      progress: null
      progress_variant: null
      sortable: true
      title: Service
      unit: null
      width: null
    - align: null
      clickable: null
      column_type: null
      field: apdex
      link: null
      progress: null
      progress_variant: null
      sortable: true
      title: Apdex
      unit: null
      width: null
    - align: null
      clickable: null
      column_type: null
      field: throughput
      link: null
      progress: column_percent
      progress_variant: null
      sortable: true
      title: Throughput
      unit: req/min
      width: null
    - align: null
      clickable: null
      column_type: null
      field: error_rate
      link: null
      progress: value_percent
      progress_variant: error
      sortable: true
      title: Errors
      unit: '%'
      width: null
    - align: null
      clickable: null
      column_type: null
      field: p95_latency
      link: null
      progress: column_percent
      progress_variant: null
      sortable: true
      title: P95
      unit: ms
      width: null
    default_sort: COUNT(*)::numeric / GREATEST(1, EXTRACT(EPOCH FROM (MAX(timestamp)
      - MIN(timestamp))) / 60) DESC
    description: Click a service row to view its detailed metrics in the Service tab.
    layout:
      h: 6
      w: 6
      x: null
      'y': null
    on_row_click:
      navigate_to_tab: Service
      set_variable: service
      value: '{{row.service_name}}'
    sql: |
      SELECT resource___service___name as service_name, ROUND((SUM(CASE WHEN duration <= 500000000 THEN 1.0 WHEN duration <= 2000000000 THEN 0.5 ELSE 0 END)) / GREATEST(1, COUNT(*))::numeric, 2) as apdex, ROUND((COUNT(*)::numeric / GREATEST(1, EXTRACT(EPOCH FROM (MAX(timestamp) - MIN(timestamp))) / 60)), 2) as throughput, ROUND((COUNT(*) FILTER (WHERE status_code = 'ERROR' OR COALESCE(attributes___http___response___status_code, 0) >= 500) * 100.0 / GREATEST(1, COUNT(*))::numeric), 2) as error_rate, ROUND((approx_percentile(0.95, percentile_agg(duration))::numeric / 1000000), 2) as p95_latency FROM otel_logs_and_spans WHERE project_id='{{project_id}}' AND resource___service___name IS NOT NULL AND kind = 'server' AND duration IS NOT NULL {{time_filter}} GROUP BY resource___service___name ORDER BY {{table_sort}} LIMIT 50
    title: Services Health
    type: table
  - layout:
      h: 6
      w: 6
      x: null
      'y': null
    title: Ongoing Issues
    type: anomalies
  - layout:
      h: 4
      w: 6
      x: null
      'y': null
    query: |
      resource.service.name != null
      | summarize count() by bin_auto(timestamp), resource.service.name
      | order by timestamp desc
      | limit 10000
    title: Events by Service
    type: timeseries
    unit: events
  - layout:
      h: 4
      w: 6
      x: null
      'y': null
    query: |
      status_code == "ERROR" and resource.service.name != null
      | summarize count() by bin_auto(timestamp), resource.service.name
      | order by timestamp desc
      | limit 10000
    theme: roma
    title: Error Rates by Service
    type: timeseries
    unit: errors
  - layout:
      h: 4
      w: 6
      x: null
      'y': null
    query: |
      resource.service.name != null and kind == "server"
      | summarize count() by bin_auto(timestamp), resource.service.name
      | order by timestamp desc
      | limit 10000
    title: HTTP Request Volume by Service
    type: timeseries
    unit: reqs
  - layout:
      h: 4
      w: 6
      x: null
      'y': null
    query: |
      (kind == "server" or name == "apitoolkit-http-span" or name == "monoscope.http") and attributes.http.response.status_code != null
      | summarize count() by bin_auto(timestamp), coalesce(tostring(attributes.http.response.status_code), "unknown")
      | order by timestamp desc
      | limit 10000
    title: HTTP Requests by Status Code
    type: timeseries
    unit: reqs
  - layout:
      h: 4
      w: 6
      x: null
      'y': null
    query: |
      (kind == "server" or name == "apitoolkit-http-span" or name == "monoscope.http") and attributes.http.response.status_code != null and attributes.http.response.status_code >= 400
      | extend error_category = case(attributes.http.response.status_code >= 500, "5xx", attributes.http.response.status_code >= 400, "4xx", tostring(attributes.http.response.status_code))
      | summarize count() by bin_auto(timestamp), error_category
      | order by timestamp desc
      | limit 10000
    theme: roma
    title: HTTP Errors (4xx & 5xx) - Incoming
    type: timeseries
    unit: errors
  - description: Response time distribution. P50 is median, P99 shows worst-case latency
      for 1% of requests.
    hide_subtitle: true
    layout:
      h: 4
      w: 6
      x: null
      'y': null
    query: |
      (kind == "server" or name == "apitoolkit-http-span" or name == "monoscope.http") and duration != null
      | summarize percentiles(duration, 50, 75, 90, 95, 99) by bin_auto(timestamp)
      | order by timestamp desc
    summarize_by: max
    title: Request Latency Percentiles
    type: timeseries_line
    unit: ns
  - columns:
    - align: null
      clickable: null
      column_type: null
      field: db_system
      link: null
      progress: null
      progress_variant: null
      sortable: true
      title: Database
      unit: null
      width: null
    - align: null
      clickable: null
      column_type: null
      field: queries
      link: null
      progress: column_percent
      progress_variant: null
      sortable: true
      title: Queries
      unit: null
      width: null
    - align: null
      clickable: null
      column_type: null
      field: avg_ms
      link: null
      progress: null
      progress_variant: null
      sortable: true
      title: Avg
      unit: ms
      width: null
    - align: null
      clickable: null
      column_type: null
      field: error_rate
      link: null
      progress: value_percent
      progress_variant: error
      sortable: true
      title: Errors
      unit: '%'
      width: null
    default_sort: COUNT(*) DESC
    description: Click a database to view detailed metrics in the Databases tab.
    layout:
      h: 4
      w: 6
      x: null
      'y': null
    on_row_click:
      navigate_to_tab: Databases
      set_variable: database
      value: '{{row.db_system}}'
    sql: |
      SELECT
        attributes___db___system___name as db_system,
        COUNT(*) as queries,
        ROUND((AVG(duration) / 1e6)::numeric, 2) as avg_ms,
        ROUND((COUNT(*) FILTER (WHERE status_code = 'ERROR') * 100.0 / GREATEST(1, COUNT(*)))::numeric, 2) as error_rate
      FROM otel_logs_and_spans
      WHERE project_id='{{project_id}}'
        AND attributes___db___system___name IS NOT NULL
        AND duration IS NOT NULL
        {{time_filter}}
      GROUP BY db_system
      ORDER BY {{table_sort}}
    title: Database Health
    type: table
  - layout:
      h: 4
      w: 12
      x: null
      'y': null
    sql: "WITH top_endpoints AS (\n  SELECT \n    attributes___http___request___method
      || ' ' || attributes___url___path as endpoint,\n    COUNT(*) as total_count\n
      \ FROM otel_logs_and_spans\n  WHERE project_id='{{project_id}}'\n    AND (kind
      = 'server' OR name = 'apitoolkit-http-span' OR name = 'monoscope.http')\n    AND
      attributes___http___response___status_code IS NOT NULL\n    AND attributes___url___path
      IS NOT NULL\n    {{time_filter}}\n  GROUP BY endpoint\n  ORDER BY total_count
      DESC\n  LIMIT 10\n)\nSELECT \n  extract(epoch from time_bucket('{{rollup_interval}}',
      o.timestamp))::integer AS time,\n  o.attributes___http___request___method ||
      ' ' || o.attributes___url___path as endpoint,\n  COUNT(*)::float as count\nFROM
      otel_logs_and_spans o\nINNER JOIN top_endpoints t ON (o.attributes___http___request___method
      || ' ' || o.attributes___url___path) = t.endpoint\nWHERE o.project_id='{{project_id}}'\n
      \ AND (o.kind = 'server' OR o.name = 'apitoolkit-http-span' OR o.name = 'monoscope.http')\n
      \ {{time_filter}}\nGROUP BY time, o.attributes___http___request___method, o.attributes___url___path\nORDER
      BY time DESC\n"
    title: Requests by Endpoint
    type: timeseries
    unit: reqs
  - _dashboard_id: 63c445fa-f250-4565-8ed0-8fb99e983d1d
    _project_id: 00000000-0000-0000-0000-000000000000
    hide_subtitle: true
    id: 1b5f7962-bb8f-46d3-9e3f-f4f3c06c2781
    layout:
      h: 3
      w: 3
      x: null
      'y': null
    title: Vic's Widget
    type: timeseries
    unit: ms
