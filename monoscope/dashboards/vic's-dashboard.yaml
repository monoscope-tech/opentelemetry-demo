    default_sort: avg_duration DESC
    layout:
      h: 5
      w: 12
      x: null
      'y': null
    sql: |
      SELECT
        COALESCE(resource___service___name,'Unknown') AS resource_name,
        name AS span_name,
        ROUND(AVG(duration / 1000000.0), 2) AS avg_duration,
        COUNT(*) AS span_count
      FROM otel_logs_and_spans
      WHERE project_id='{{project_id}}'
        AND (parent_id = '' OR parent_id IS NULL)
        AND name IS NOT NULL
        AND duration IS NOT NULL
        AND resource___service___name = '{{var-service}}'
        {{time_filter}}
      GROUP BY resource___service___name, name
      ORDER BY {{table_sort}}
      LIMIT 20
    title: Root Operation Summary
    type: table
  - columns:
    - align: null
      clickable: null
      column_type: null
      field: operation_name
