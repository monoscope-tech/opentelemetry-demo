    sql: |
      WITH cpu_metrics AS (
        SELECT
          COALESCE(resource___service___name, resource___container___name, 'unknown') as service,
          value::numeric * 100 as value
        FROM otel_metrics
        WHERE project_id='{{project_id}}'
          AND metric_name IN ('container.cpu.utilization', 'jvm.cpu.recent_utilization', 'process.cpu.utilization')
          {{time_filter}}
      ),
      mem_metrics AS (
        SELECT
          COALESCE(resource___service___name, resource___container___name, 'unknown') as service,
          value::numeric as value
        FROM otel_metrics
        WHERE project_id='{{project_id}}'
          AND metric_name = 'container.memory.percent'
          {{time_filter}}
      )
      SELECT
        COALESCE(c.service, m.service) as service,
        ROUND(AVG(c.value)::numeric, 1) as cpu_avg,
        ROUND(MAX(c.value)::numeric, 1) as cpu_max,
        ROUND(AVG(m.value)::numeric, 1) as mem_avg,
        ROUND(MAX(m.value)::numeric, 1) as mem_max,
        (COUNT(c.*) + COUNT(m.*)) as data_points
      FROM cpu_metrics c
      FULL OUTER JOIN mem_metrics m ON c.service = m.service
      GROUP BY COALESCE(c.service, m.service)
      ORDER BY {{table_sort}}
      LIMIT 20
